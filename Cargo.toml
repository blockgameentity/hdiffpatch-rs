[package]
name = "hdiffpatch-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe, ergonomic Rust bindings to HDiffPatch with zstd compression and directory diff/patch support."
links = "hdiffpatch"
build = "build.rs"

[dependencies]
cxx = "1.0"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
cxx-build = { version = "1.0" }
cc = "1.0"

[features]
default = []

[lib]
name = "hdiffpatch_rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "hdiffpatch"
path = "src/main.rs"

[package.metadata]
default-run = "hdiffpatch"
